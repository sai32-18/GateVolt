
<script>
(function () {
  "use strict";

  /* ---------- STATE ---------- */

  appState.syllabusNotes = appState.syllabusNotes || {};
  appState.syllabusVisited = appState.syllabusVisited || {};

  function getOfficialUnit(id) {
    var all = allOfficialUnits();

    for (var i = 0; i < all.length; i++) {
      if (all[i].id === id) return all[i];
    }

    return null;
  }

  function officialCompleted(id) {
    return !!(appState.syllabusCompleted || {})[id];
  }

  function markOfficialComplete(id) {
    appState.syllabusCompleted =
      appState.syllabusCompleted || {};

    appState.syllabusCompleted[id] =
      !appState.syllabusCompleted[id];

    saveState();
    render();
  }

  function markOfficialVisited(id) {
    appState.syllabusVisited =
      appState.syllabusVisited || {};

    appState.syllabusVisited[id] = true;

    saveState();
  }

  /* ---------- SECTION ICONS ---------- */

  function syllabusIcon(section) {
    var s = String(section).toLowerCase();

    if (s.indexOf("mathematics") >= 0) return "📐";
    if (s.indexOf("circuits") >= 0) return "🔋";
    if (s.indexOf("electromagnetic") >= 0) return "🧲";
    if (s.indexOf("signals") >= 0) return "〰️";
    if (s.indexOf("machines") >= 0) return "⚙️";
    if (s.indexOf("power systems") >= 0) return "⚡";
    if (s.indexOf("control") >= 0) return "🎛️";
    if (s.indexOf("measurements") >= 0) return "📏";
    if (s.indexOf("analog") >= 0) return "💻";
    if (s.indexOf("power electronics") >= 0) return "🔌";
    if (s.indexOf("aptitude") >= 0) return "🧠";

    return "📘";
  }

  /* ---------- FIND RELATED CORE TOPICS ---------- */

  function relatedCoreTopics(unit) {
    var words = String(unit.title)
      .toLowerCase()
      .split(/[^a-z0-9]+/)
      .filter(function (w) {
        return w.length >= 4;
      });

    var results = [];

    subjects.forEach(function (s) {
      s.topics.forEach(function (t, i) {

        var text =
          (t[0] + " " + t[1]).toLowerCase();

        var hit = words.some(function (w) {
          return text.indexOf(w) >= 0;
        });

        if (hit) {
          results.push({
            subject: s,
            topic: t,
            index: i
          });
        }
      });
    });

    return results.slice(0, 4);
  }

  /* ---------- FIND RELATED QUESTIONS ---------- */

  function relatedQuestions(unit) {
    var words = String(unit.title)
      .toLowerCase()
      .split(/[^a-z0-9]+/)
      .filter(function (w) {
        return w.length >= 4;
      });

    return questions.filter(function (q) {

      var text =
        (q[0] + " " + q[1] + " " + q[3])
        .toLowerCase();

      return words.some(function (w) {
        return text.indexOf(w) >= 0;
      });

    }).slice(0, 5);
  }

  /* ---------- OFFICIAL UNIT PAGE ---------- */

  function officialUnitView() {

    var unit =
      getOfficialUnit(window.selectedOfficialUnit);

    if (!unit) {
      currentView = "syllabus";
      return officialSyllabusView();
    }

    markOfficialVisited(unit.id);

    var done = officialCompleted(unit.id);

    var related =
      relatedCoreTopics(unit);

    var qs =
      relatedQuestions(unit);

    var note =
      (appState.syllabusNotes || {})[unit.id] || "";

    var h = "";

    h += '<div class="page">';

    /* HERO */

    h += '<div class="hero">';

    h += '<span class="tag">' +
      syllabusIcon(unit.section) +
      ' OFFICIAL SYLLABUS' +
      '</span>';

    h += '<h1>' +
      esc(unit.title) +
      '</h1>';

    h += '<p><b>Section:</b> ' +
      esc(unit.section) +
      '</p>';

    h += '<p>' +
      esc(unit.detail) +
      '</p>';

    h += '<div class="progressbar">';

    h += '<div class="progressfill" style="width:' +
      (done ? 100 : 0) +
      '%"></div>';

    h += '</div>';

    h += '<p class="small">' +
      (done
        ? "✓ Marked as covered"
        : "Not marked as covered") +
      '</p>';

    h += '</div>';

    /* STUDY PLAN */

    h += '<div class="section-title">Study Plan</div>';

    h += '<div class="card">';

    h += '<div class="notice">';
    h += '<b>1. Learn the concept</b><br>';
    h += esc(unit.detail);
    h += '</div>';

    h += '<div class="notice">';
    h += '<b>2. Use the existing GateVolt material</b><br>';
    h += esc(unit.guide);
    h += '</div>';

    h += '<div class="notice">';
    h += '<b>3. Solve questions</b><br>';
    h += 'Start with related questions below, then use Practice for timed solving.';
    h += '</div>';

    h += '<div class="notice">';
    h += '<b>4. Review mistakes</b><br>';
    h += 'Record mistakes and revisit this unit before marking it mastered.';
    h += '</div>';

    h += '</div>';

    /* REFERENCE */

    h += '<div class="section-title">Reference</div>';

    h += '<div class="card">';

    h += '<span class="tag">📖 Recommended reference</span>';

    h += '<p style="margin-top:10px">' +
      esc(unit.book) +
      '</p>';

    h += '</div>';

    /* RELATED TOPICS */

    h += '<div class="section-title">Related GateVolt Topics</div>';

    if (related.length) {

      related.forEach(function (r) {

        h += '<button class="subject" onclick="' +
          "selectedSubject='" +
          r.subject.id +
          "';selectedTopic=" +
          r.index +
          ";currentView='topic';render();" +
          '">';

        h += '<div class="subject-icon">' +
          r.subject.icon +
          '</div>';

        h += '<div class="subject-info">';

        h += '<b>' +
          esc(r.topic[0]) +
          '</b>';

        h += '<small>' +
          esc(r.subject.name) +
          '</small>';

        h += '</div>';

        h += '<span class="arrow">›</span>';

        h += '</button>';

      });

    } else {

      h += '<div class="empty">';
      h += 'No direct existing core-topic match found.';
      h += '</div>';

    }

    /* RELATED QUESTIONS */

    h += '<div class="section-title">Related Questions</div>';

    if (qs.length) {

      qs.forEach(function (q) {

        h += '<div class="card">';

        h += '<span class="tag ' +
          String(q[2]).toLowerCase() +
          '">' +
          esc(q[2]) +
          '</span>';

        h += '<p style="margin-top:9px"><b>' +
          esc(q[3]) +
          '</b></p>';

        h += '<p class="small">' +
          esc(q[6]) +
          '</p>';

        h += '</div>';

      });

    } else {

      h += '<div class="empty">';
      h += 'No directly matched question. Use Practice to continue.';
      h += '</div>';

    }

    /* NOTES */

    h += '<div class="section-title">My Notes</div>';

    h += '<div class="card">';

    h += '<textarea id="officialNote" ';

    h += 'placeholder="Write your shortcut, mistake, formula or revision note..." ';

    h += 'style="width:100%;min-height:130px;' +
      'background:#0d0d1a;' +
      'border:1px solid rgba(255,255,255,.08);' +
      'border-radius:10px;' +
      'padding:12px;color:#fff;resize:vertical;">';

    h += esc(note);

    h += '</textarea>';

    h += '<button class="btn secondary" ' +
      'onclick="saveOfficialNote()">';

    h += 'Save Note';

    h += '</button>';

    h += '</div>';

    /* ACTION BUTTONS */

    h += '<button class="btn success" ' +
      'onclick="toggleOfficialComplete()">';

    h += done
      ? '✓ Marked Covered — Tap to Undo'
      : '✓ Mark This Unit Covered';

    h += '</button>';

    h += '<button class="btn" ' +
      'onclick="startOfficialPractice()">';

    h += '🎯 Practice This Unit';

    h += '</button>';

    h += '<button class="btn secondary" ' +
      'onclick="nextOfficialUnit()">';

    h += 'Next Unfinished Unit →';

    h += '</button>';

    h += '<button class="btn secondary" ' +
      'onclick="currentView=\'syllabus\';render()">';

    h += '← Back to Official Syllabus';

    h += '</button>';

    h += '</div>';

    return h;
  }

  /* ---------- SAVE NOTES ---------- */

  window.saveOfficialNote = function () {

    var el =
      document.getElementById("officialNote");

    if (!el) return;

    appState.syllabusNotes =
      appState.syllabusNotes || {};

    appState.syllabusNotes[
      window.selectedOfficialUnit
    ] = el.value;

    saveState();

    el.blur();

    alert("Note saved ✓");
  };

  /* ---------- COMPLETE UNIT ---------- */

  window.toggleOfficialComplete = function () {

    if (!window.selectedOfficialUnit) return;

    markOfficialComplete(
      window.selectedOfficialUnit
    );
  };

  /* ---------- OPEN UNIT ---------- */

  window.openOfficialUnit = function (id) {

    window.selectedOfficialUnit = id;

    currentView = "officialUnit";

    render();
  };

  /* ---------- NEXT UNFINISHED ---------- */

  window.nextOfficialUnit = function () {

    var all = allOfficialUnits();

    var start = 0;

    for (var i = 0; i < all.length; i++) {

      if (
        all[i].id ===
        window.selectedOfficialUnit
      ) {
        start = i + 1;
        break;
      }
    }

    var next = null;

    /* Search after current */

    for (var j = start; j < all.length; j++) {

      if (!officialCompleted(all[j].id)) {

        next = all[j];

        break;
      }
    }

    /* Wrap around */

    if (!next) {

      for (var k = 0; k < start; k++) {

        if (!officialCompleted(all[k].id)) {

          next = all[k];

          break;
        }
      }
    }

    if (next) {

      window.selectedOfficialUnit =
        next.id;

      currentView =
        "officialUnit";

      render();

    } else {

      alert(
        "🎉 All official syllabus units are marked covered!"
      );

    }
  };

  /* ---------- PRACTICE THIS UNIT ---------- */

  window.startOfficialPractice = function () {

    var unit =
      getOfficialUnit(
        window.selectedOfficialUnit
      );

    if (!unit) return;

    var qs =
      relatedQuestions(unit);

    if (!qs.length) {

      alert(
        "No directly matched question is available yet. " +
        "Use the main Practice section for mixed questions."
      );

      return;
    }

    practicePool = qs;

    practiceIndex = 0;

    practiceAnswered = false;

    lastChoice = -1;

    appState.sessionAnswers = [];

    currentView = "practice";

    render();
  };

  /* ---------- SYLLABUS CARD ---------- */

  window.syllabusCard = function (u) {

    var done =
      !!(appState.syllabusCompleted || {})[u.id];

    return (

      '<div class="card syllabus-unit" ' +
      'style="padding:12px">' +

      '<div style="display:flex;gap:10px;' +
      'align-items:center">' +

      '<div class="subject-icon">' +
      (done
        ? "✓"
        : syllabusIcon(u.section)) +
      '</div>' +

      '<div class="subject-info">' +

      '<b>' +
      esc(u.title) +
      '</b>' +

      '<small>' +
      esc(u.section) +
      '</small>' +

      '<small style="margin-top:4px">' +
      (done
        ? "Covered"
        : "Not covered") +
      '</small>' +

      '</div>' +

      '</div>' +

      '<button class="btn" ' +
      'onclick="openOfficialUnit(\'' +
      u.id +
      '\')">' +

      '📖 Study Unit' +

      '</button>' +

      '<button class="btn secondary" ' +
      'onclick="markSyllabusUnit(\'' +
      u.id +
      '\')">' +

      (done
        ? '↩ Mark Pending'
        : '✓ Mark Covered') +

      '</button>' +

      '</div>'
    );
  };

  /* ---------- CONTENT ROUTER ---------- */

  var oldViewContent =
    window.viewContent;

  window.viewContent = function () {

    if (currentView === "officialUnit") {

      return officialUnitView();

    }

    return oldViewContent();

  };

  /* ---------- BACK BUTTON ---------- */

  var oldGoBack =
    window.goBack;

  window.goBack = function () {

    if (currentView === "officialUnit") {

      currentView = "syllabus";

      render();

      return;

    }

    oldGoBack();

  };

})();
</script>
