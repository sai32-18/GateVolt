function officialUnits(){
  var out=[];
  Object.keys(officialSyllabus).forEach(function(section){
    officialSyllabus[section].forEach(function(u,i){
      out.push({id:'ee_'+Object.keys(officialSyllabus).indexOf(section)+'_'+i,section:section,title:u[0],detail:u[1],guide:u[2],book:u[3]});
    });
  });
  return out;
}
function gaUnits(){
  var out=[];
  Object.keys(officialGA).forEach(function(section){
    officialGA[section].forEach(function(item,i){
      out.push({id:'ga_'+Object.keys(officialGA).indexOf(section)+'_'+i,section:section,title:item,detail:'Official GATE 2026 General Aptitude syllabus item.',guide:'Learn the definition/skill, then solve timed examples and review mistakes.',book:'GATE General Aptitude practice resources'});
    });
  });
  return out;
}
function allOfficialUnits(){return officialUnits().concat(gaUnits());}
function syllabusDoneCount(){
  var st=appState.syllabusCompleted||{};
  return allOfficialUnits().filter(function(u){return !!st[u.id]}).length;
}
function syllabusPercent(){
  var n=allOfficialUnits().length;
  return n?Math.round(syllabusDoneCount()/n*100):0;
}
function markSyllabusUnit(id){
  appState.syllabusCompleted=appState.syllabusCompleted||{};
  appState.syllabusCompleted[id]=!appState.syllabusCompleted[id];
  saveState();render();
}
function syllabusCard(u){
  var done=!!(appState.syllabusCompleted||{})[u.id];
  return '<button class="subject syllabus-unit" onclick="markSyllabusUnit(\''+u.id+'\')"><div class="subject-icon">'+(done?'✓':'📘')+'</div><div class="subject-info"><b>'+esc(u.title)+'</b><small>'+esc(u.detail)+'</small><small style="margin-top:5px;color:#4FC3F7">'+(done?'Covered • tap to mark pending':'Not marked • tap when mastered')+'</small></div><span class="arrow">›</span></button>';
}
function officialSyllabusView(){
  var units=allOfficialUnits(),q=(syllabusFilter||'').trim().toLowerCase();
  if(q) units=units.filter(function(u){return (u.section+' '+u.title+' '+u.detail+' '+u.guide).toLowerCase().indexOf(q)>=0;});
  var sections=[];
  units.forEach(function(u){if(sections.indexOf(u.section)<0)sections.push(u.section);});
  var h='<div class="page"><div class="hero"><span class="tag">OFFICIAL 2026</span><h1>Complete GATE Syllabus 📚</h1><p>Every official EE syllabus item plus the complete General Aptitude syllabus is tracked separately. Existing GateVolt topics and data remain untouched.</p><div class="progressbar"><div class="progressfill" style="width:'+syllabusPercent()+'%"></div></div><p class="small">'+syllabusDoneCount()+' / '+allOfficialUnits().length+' official learning units marked covered ('+syllabusPercent()+'%)</p></div>';
  h+='<div class="notice"><b>Official source:</b> IIT Guwahati GATE 2026 syllabus. This screen is a coverage checklist; marking an item complete means you have studied it, not merely opened it.</div>';
  h+='<input class="search" placeholder="Search official syllabus..." value="'+esc(syllabusFilter)+'" oninput="syllabusFilter=this.value;renderOfficialSyllabusResults()">';
  h+='<div id="officialSyllabusResults">';
  sections.forEach(function(sec){
    var arr=units.filter(function(u){return u.section===sec;});
    h+='<div class="section-title">'+esc(sec)+' <span class="badge">'+arr.length+'</span></div>';
    arr.forEach(function(u){h+=syllabusCard(u);});
  });
  h+='</div><button class="btn secondary" onclick="openOfficialSource()">Open official GATE 2026 syllabus</button></div>';
  return h;
}
function renderOfficialSyllabusResults(){
  var root=document.getElementById('officialSyllabusResults');
  if(!root)return;
  var units=allOfficialUnits(),q=(syllabusFilter||'').trim().toLowerCase();
  if(q)units=units.filter(function(u){return (u.section+' '+u.title+' '+u.detail+' '+u.guide).toLowerCase().indexOf(q)>=0;});
  var sections=[];
  units.forEach(function(u){if(sections.indexOf(u.section)<0)sections.push(u.section);});
  var out='';
  sections.forEach(function(sec){
    var arr=units.filter(function(u){return u.section===sec;});
    out+='<div class="section-title">'+esc(sec)+' <span class="badge">'+arr.length+'</span></div>';
    arr.forEach(function(u){out+=syllabusCard(u);});
  });
  root.innerHTML=out||'<div class="empty">No official syllabus item matches that search.</div>';
}
function openOfficialSource(){
  window.location.href='https://gate2026.iitg.ac.in/doc/GATE2026_Syllabus/EE_2026_Syllabus.pdf';
}
function showOfficialSyllabus(){currentView='syllabus';syllabusFilter='';render();}

function _initBridge(){if(typeof iappyx==='undefined'){setTimeout(_initBridge,50);return;}onReady();}
window.addEventListener('load',function(){setTimeout(_initBridge,200);});

function onReady(){
 try{appState=JSON.parse(iappyx.load('gatevolt_state')||'{}')}catch(e){appState={};}
 appState.completed=appState.completed||{};appState.attempted=appState.attempted||{};appState.bookmarks=appState.bookmarks||{};appState.practiceCorrect=appState.practiceCorrect||0;appState.practiceTotal=appState.practiceTotal||0;appState.mockScores=appState.mockScores||[];appState.syllabusCompleted=appState.syllabusCompleted||{};
 render();
}
function saveState(){try{iappyx.save('gatevolt_state',JSON.stringify(appState));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function subj(id){return subjects.find(function(s){return s.id===id})||subjects[0];}
function accuracy(){return appState.practiceTotal?Math.round(appState.practiceCorrect/appState.practiceTotal*100):0;}
function totalTopics(){return subjects.reduce(function(n,s){return n+s.topics.length},0);}
function doneTopics(){return Object.keys(appState.completed).filter(function(k){return appState.completed[k]}).length;}
function render(){document.getElementById('app').innerHTML=header()+viewContent()+bottomNav();window.scrollTo(0,0);}
function header(){
 if(currentView==='home')return '<div class="header"><div><div class="logo">Gate<span>Volt</span> ⚡</div><div class="subtitle">GATE Electrical Engineering • Offline First</div></div><button class="iconbtn" onclick="showProgress()">📊</button></div>';
 return '<div class="header"><div class="topback"><button class="backbtn" onclick="goBack()">‹</button><div><div class="logo">Gate<span>Volt</span></div><div class="subtitle">GATE EE preparation</div></div></div></div>';
}
function bottomNav(){
 return '<div class="bottomnav">'+
 '<button class="navitem '+(currentView==='home'?'active':'')+'" onclick="goHome()"><span class="navicon">⌂</span>Home</button>'+
 '<button class="navitem '+(currentView==='learn'||currentView==='subject'||currentView==='topic'?'active':'')+'" onclick="showLearn()"><span class="navicon">📚</span>Learn</button>'+
 '<button class="navitem '+(currentView==='practice'?'active':'')+'" onclick="startPractice()"><span class="navicon">✓</span>Practice</button>'+
 '<button class="navitem '+(currentView==='formulas'?'active':'')+'" onclick="showFormulas()"><span class="navicon">Σ</span>Formula</button>'+
 '<button class="navitem '+(currentView==='ai'?'active':'')+'" onclick="showAI()"><span class="navicon">🤖</span>AI</button></div>';
}
function viewContent(){
 if(currentView==='home')return homeView();
 if(currentView==='learn')return learnView();
 if(currentView==='subject')return subjectView();
 if(currentView==='topic')return topicView();
 if(currentView==='practice')return practiceView();
 if(currentView==='pyq')return pyqView();
 if(currentView==='mock')return mockView();

 if(currentView==='ai')return aiView();

function subjectCard(s){

  /* Formula bookmarks use the formula's real array index, so filtering/searching cannot change which formula is starred. */
  window.formulaRows=function(arr){
    if(!arr.length)return '<div class="empty">No formulas found.</div>';
    return arr.map(function(f){
      var idx=formulas.indexOf(f),key='f_'+idx,star=!!appState.bookmarks[key];
      return '<div class="card"><button class="star" onclick="toggleBookmark(\''+key+'\')">'+(star?'⭐':'☆')+'</button><span class="tag">'+esc(f[0])+'</span><h3 style="font-size:14px;margin:8px 0">'+esc(f[1])+'</h3><div class="formula">'+esc(f[2])+'</div></div>';
    }).join('');
  };

  /* Prevent accidental double initialization when both bridge and browser load callbacks fire. */
  if(document.readyState==='complete' || document.readyState==='interactive'){
    setTimeout(function(){window._initBridge();},0);
  }else{
    window.addEventListener('DOMContentLoaded',function(){setTimeout(function(){window._initBridge();},0);});
  }
})();

/* ============================================================
   GATEVOLT ULTIMATE UPGRADE — additive layer
   Preserves all existing content and gatevolt_state keys.
   Adds: enhanced practice controls, syllabus hub, formula tools,
   mock controls, analytics dashboard, AI study coach, gamification,
   and optional cloud sync/backup.
   ============================================================ */
(function(){
  var GV={
    version:'2.0.0',
    XP_PER_CORRECT:10,
    XP_PER_TOPIC:25,
    XP_PER_SYLLABUS:5,
    XP_PER_MOCK:50
  };
  function state(){
    appState=appState&&typeof appState==='object'?appState:{};
    appState.gamification=appState.gamification&&typeof appState.gamification==='object'?appState.gamification:{};
    var g=appState.gamification;
    g.xp=Number(g.xp)||0; g.level=Number(g.level)||1; g.streak=Number(g.streak)||0;
    g.lastActive=g.lastActive||''; g.sessions=Number(g.sessions)||0;
    g.badges=Array.isArray(g.badges)?g.badges:[];
    appState.practiceHistory=Array.isArray(appState.practiceHistory)?appState.practiceHistory:[];
    appState.mockScores=Array.isArray(appState.mockScores)?appState.mockScores:[];
    appState.sync=appState.sync&&typeof appState.sync==='object'?appState.sync:{};
    return appState;
  }
  function today(){return new Date().toISOString().slice(0,10)}
  function daysBetween(a,b){var x=new Date(a+'T00:00:00Z'),y=new Date(b+'T00:00:00Z');return Math.round((y-x)/86400000)}
  function touch(){
    state(); var d=today(),g=appState.gamification;
    if(g.lastActive!==d){ if(g.lastActive && daysBetween(g.lastActive,d)===1) g.streak++; else if(g.lastActive!==d) g.streak=1; g.lastActive=d; }
  }
  function award(n,reason){
    state(); touch(); var g=appState.gamification; g.xp+=Math.max(0,n||0); g.level=Math.max(1,Math.floor(g.xp/100)+1);
    badges(); saveState();
  }
  function badges(){
    state(); var g=appState.gamification, b=g.badges;
    function add(id){if(b.indexOf(id)<0)b.push(id)}
    if(appState.practiceTotal>=1)add('first_question');
    if(appState.practiceTotal>=25)add('25_questions');
    if(appState.practiceTotal>=100)add('100_questions');
    if((appState.practiceCorrect||0)>=25)add('25_correct');
    if((appState.mockScores||[]).length>=1)add('first_mock');
    if((appState.mockScores||[]).length>=5)add('5_mocks');
    if(g.streak>=7)add('7_day_streak');
    if(syllabusDoneCount && syllabusDoneCount()>=25)add('25_syllabus');
  }
  function esc2(x){return typeof esc==='function'?esc(x):String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function badgeName(id){return ({'first_question':'First Question','25_questions':'25 Questions','100_questions':'100 Questions','25_correct':'25 Correct','first_mock':'First Mock','5_mocks':'5 Mocks','7_day_streak':'7-Day Streak','25_syllabus':'25 Syllabus Units'})[id]||id}
  function xpProgress(){var g=state().gamification,base=(g.level-1)*100;return Math.round((g.xp-base)/100*100)}

  /* Upgrade persistence wrapper: never deletes old keys. */
  var oldSave=window.saveState;
  window.saveState=function(){state();try{badges()}catch(e){};if(oldSave)oldSave();else{try{localStorage.setItem('gatevolt_state',JSON.stringify(appState))}catch(e){}}};

  /* Gamification hooks — additive, no question/data replacement. */
  var oldAnswerPractice=window.answerPractice;
  window.answerPractice=function(i){
    var q=practicePool[practiceIndex],was=practiceAnswered;
    if(oldAnswerPractice)oldAnswerPractice(i);
    if(!was && q){award(i===q[5]?GV.XP_PER_CORRECT:2,'practice');}
  };
  var oldMarkTopic=window.markTopic;
  window.markTopic=function(k){var was=!!appState.completed[k];if(oldMarkTopic)oldMarkTopic(k);if(!was && appState.completed[k])award(GV.XP_PER_TOPIC,'topic');};
  var oldMarkSyllabus=window.markSyllabusUnit;
  window.markSyllabusUnit=function(id){var was=!!((appState.syllabusCompleted||{})[id]);if(oldMarkSyllabus)oldMarkSyllabus(id);if(!was && ((appState.syllabusCompleted||{})[id]))award(GV.XP_PER_SYLLABUS,'syllabus');};
  var oldAnswerMock=window.answerMock;
  window.answerMock=function(i){var idx=mockIndex,q=mockPool[idx];if(oldAnswerMock)oldAnswerMock(i);if(q)award(i===q[5]?GV.XP_PER_CORRECT:2,'mock');};

  /* Enhanced practice selector without changing the existing question bank. */
  window.startPracticeMode=function(mode){
    var base=questions.slice(); mode=mode||'all';
    if(mode==='weak') base=base.filter(function(q){return (appState.mistakes||[]).indexOf(q[7]||q[3])>=0});
    if(mode==='bookmarks') base=base.filter(function(q){return !!appState.bookmarks['q_'+(q[7]||q[3])]});
    if(mode==='random') base.sort(function(){return Math.random()-.5});
    if(!base.length)base=questions.slice();
    practicePool=base;practiceIndex=0;practiceAnswered=false;lastChoice=-1;appState.sessionAnswers=[];currentView='practice';render();
  };

  /* Rich dashboard / gamification view. */
  window.showUpgradeDashboard=function(){currentView='upgrade';render();};
  window.upgradeDashboardView=function(){
    state();touch();badges();var g=appState.gamification;
    var done=doneTopics(),total=totalTopics(),acc=accuracy();
    var top=subjects.map(function(s){return {s:s,p:subjectProgress(s.id)}}).sort(function(a,b){return b.p-a.p}).slice(0,4);
    var weak=subjects.map(function(s){return {s:s,p:subjectProgress(s.id)}}).sort(function(a,b){return a.p-b.p}).slice(0,4);
    var html='<div class="page"><div class="hero"><span class="tag">GATEVOLT 2.0</span><h1>Study Dashboard 🚀</h1><p>Your original GateVolt progress remains intact. This dashboard adds XP, streaks, badges, analytics and smarter study controls.</p><div class="progressbar"><div class="progressfill" style="width:'+xpProgress()+'%"></div></div><p class="small">Level '+g.level+' • '+g.xp+' XP • '+g.streak+' day streak</p></div>';
    html+='<div class="statgrid"><div class="stat"><strong>'+acc+'%</strong><small>Accuracy</small></div><div class="stat"><strong>'+appState.practiceTotal+'</strong><small>Questions</small></div><div class="stat"><strong>'+done+'/'+total+'</strong><small>Topics</small></div></div>';
    html+='<div class="section-title">Practice Engine 🎯</div><div class="grid">'+tile('🎯','All Questions','Full question bank','startPracticeMode(\'all\')')+tile('🧠','Weak Areas','Mistakes first','startPracticeMode(\'weak\')')+tile('🔀','Random','Shuffle practice','startPracticeMode(\'random\')')+tile('⭐','Bookmarked','Saved questions','startPracticeMode(\'bookmarks\')')+'</div>';
    html+='<div class="section-title">Gamification 🏆</div><div class="card"><b>Level '+g.level+'</b><p class="small">'+g.xp+' XP total • '+g.streak+' day streak</p><p style="margin-top:10px">'+(g.badges.length?g.badges.map(function(id){return '<span class="tag" style="margin:3px">🏅 '+esc2(badgeName(id))+'</span>'}).join(' '):'No badges yet — answer questions to earn your first one.')+'</p></div>';
    html+='<div class="section-title">Strong Areas</div>'+top.map(function(x){return '<div class="card"><b>'+x.s.icon+' '+esc2(x.s.name)+'</b><span class="badge">'+x.p+'%</span></div>'}).join('');
    html+='<div class="section-title">Focus Next</div>'+weak.map(function(x){return '<div class="card"><b>'+x.s.icon+' '+esc2(x.s.name)+'</b><span class="badge">'+x.p+'%</span><p class="small">Prioritize practice and revision here.</p></div>'}).join('');
    html+='<div class="section-title">Mock Performance</div>'+((appState.mockScores||[]).length?appState.mockScores.slice().reverse().slice(0,8).map(function(m){return '<div class="card"><b>'+esc2(m.date)+'</b><span class="badge">'+m.score+'%</span><p class="small">'+m.correct+'/'+m.total+' correct</p></div>'}).join(''):'<div class="empty">No mock results yet.</div>');
    html+='<button class="btn" onclick="showProgress()">Open detailed Progress</button><button class="btn secondary" onclick="showCloudSync()">☁️ Cloud Sync & Backup</button></div>';
    return html;
  };

  /* Cloud sync: secure-by-default local export/import plus optional REST endpoint.
     No secret is embedded. A user-supplied HTTPS endpoint can store the JSON state. */
  window.showCloudSync=function(){currentView='cloud';render();};
  window.cloudView=function(){
    state();var c=appState.sync||{};
    return '<div class="page"><div class="hero"><span class="tag">DATA SAFE</span><h1>Cloud Sync ☁️</h1><p>All existing local progress stays on-device. You can export a backup anytime, restore it later, or connect an HTTPS JSON sync endpoint you control.</p></div>'+
      '<div class="card"><h3>Local backup</h3><p class="small">Recommended before major app updates. This exports the complete GateVolt state, including old progress keys.</p><button class="btn" onclick="exportGateVoltState()">⬇️ Export Backup</button><button class="btn secondary" onclick="document.getElementById(\'restoreFile\').click()">⬆️ Restore Backup</button><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreGateVoltState(this.files[0])"></div>'+
      '<div class="card"><h3>Optional remote sync</h3><p class="small">For true cross-device sync, enter an HTTPS endpoint that accepts GET and PUT JSON for your user. GateVolt does not ship a hard-coded third-party account or secret.</p><input id="syncEndpoint" class="search" value="'+esc2(c.endpoint||'')+'" placeholder="https://your-server.example/gatevolt/state"><input id="syncToken" class="search" value="'+esc2(c.token||'')+'" placeholder="Optional access token" type="password"><button class="btn" onclick="saveSyncSettings()">Save Sync Settings</button><button class="btn secondary" onclick="pushCloudState()">☁️ Push Local → Cloud</button><button class="btn secondary" onclick="pullCloudState()">☁️ Pull Cloud → Local</button><p id="syncStatus" class="small" style="margin-top:10px">'+esc2(c.lastStatus||'Not synced yet.')+'</p></div>'+
      '<div class="notice"><b>Important:</b> Cloud sync requires a server you control or trust. The app remains fully usable offline without it.</div><button class="btn secondary" onclick="goHome()">Back to Home</button></div>';
  };
  window.exportGateVoltState=function(){state();var blob=new Blob([JSON.stringify({format:'gatevolt-backup',version:GV.version,state:appState},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GateVolt-backup-'+today()+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);};
  window.restoreGateVoltState=function(file){if(!file)return;var r=new FileReader();r.onload=function(){try{var obj=JSON.parse(r.result),incoming=obj&&obj.state?obj.state:obj;if(!incoming||typeof incoming!=='object')throw Error('Invalid');var old=appState||{};appState=Object.assign({},old,incoming);appState.completed=Object.assign({},old.completed||{},incoming.completed||{});appState.attempted=Object.assign({},old.attempted||{},incoming.attempted||{});appState.bookmarks=Object.assign({},old.bookmarks||{},incoming.bookmarks||{});saveState();alert('GateVolt backup restored without removing existing keys.');render();}catch(e){alert('Backup could not be restored. Please choose a GateVolt JSON backup.');}};r.readAsText(file);};
  window.saveSyncSettings=function(){state();appState.sync.endpoint=(document.getElementById('syncEndpoint')||{}).value||'';appState.sync.token=(document.getElementById('syncToken')||{}).value||'';appState.sync.lastStatus='Settings saved locally.';saveState();render();};
  function syncFetch(url,opts){return fetch(url,opts)}
  window.pushCloudState=function(){state();var c=appState.sync||{},url=c.endpoint;if(!url){alert('Add an HTTPS sync endpoint first.');return;}var headers={'Content-Type':'application/json'};if(c.token)headers.Authorization='Bearer '+c.token;syncFetch(url,{method:'PUT',headers:headers,body:JSON.stringify({app:'GateVolt',version:GV.version,state:appState})}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);appState.sync.lastStatus='Uploaded '+new Date().toLocaleString();saveState();render();}).catch(function(e){alert('Cloud upload failed: '+e.message);});};
  window.pullCloudState=function(){state();var c=appState.sync||{},url=c.endpoint;if(!url){alert('Add an HTTPS sync endpoint first.');return;}var headers={};if(c.token)headers.Authorization='Bearer '+c.token;syncFetch(url,{headers:headers}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(obj){var incoming=obj&&obj.state?obj.state:obj;if(!incoming||typeof incoming!=='object')throw Error('Invalid state');var old=appState;appState=Object.assign({},old,incoming);appState.completed=Object.assign({},old.completed||{},incoming.completed||{});appState.attempted=Object.assign({},old.attempted||{},incoming.attempted||{});appState.bookmarks=Object.assign({},old.bookmarks||{},incoming.bookmarks||{});appState.sync=Object.assign({},old.sync||{},incoming.sync||{});appState.sync.lastStatus='Downloaded '+new Date().toLocaleString();saveState();render();}).catch(function(e){alert('Cloud download failed: '+e.message);});};

  /* Make all requested upgrade areas first-class views. */
  var oldViewContent=window.viewContent;
  window.viewContent=function(){
    if(currentView==='upgrade')return upgradeDashboardView();
    if(currentView==='cloud')return cloudView();
    return oldViewContent();
  };
  var oldHome=window.homeView;
  window.homeView=function(){
    var html=oldHome();
    var needle='<div class="section-title">Quick Start</div>';
    var add='<div class="card" style="border:1px solid rgba(79,195,247,.22)"><span class="tag">UPGRADE</span><h3 style="margin:8px 0">GateVolt Study System 2.0</h3><p class="small">Practice engine • Complete syllabus • Formula Book • Mock Tests • Progress • AI Teacher • XP & badges • Cloud backup</p><button class="btn" onclick="showUpgradeDashboard()">Open Study Dashboard 🚀</button></div>';
    return html.replace(needle,add+needle);
  };
  var oldGoBack=window.goBack;
  window.goBack=function(){if(currentView==='upgrade'||currentView==='cloud'){currentView='home';render();return;}oldGoBack();};

  /* Upgrade navigation from the existing Progress icon without removing it. */
  var oldHeader=window.header;
  window.header=function(){
    var h=oldHeader();
    if(currentView==='home')h=h.replace('onclick="showProgress()"','onclick="showUpgradeDashboard()" title="Study dashboard"');
    return h;
  };

  /* Initialize additive state safely after the existing app has loaded. */
  var oldOnReady=window.onReady;
  window.onReady=function(){if(oldOnReady)oldOnReady();state();touch();badges();saveState();};
  try{state();badges();}catch(e){}
})();

</script></body></html>
